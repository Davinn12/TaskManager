services:
  db:
    image: mysql:8.0
    container_name: taskmanager_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: taskmanager
      DB_USER: taskuser
      DB_PASSWORD: taskpass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskmanager_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - taskmanager_net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: taskmanager_jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - taskmanager_net

volumes:
  db_data:
  jenkins_home:

networks:
  taskmanager_net:
    driver: bridge
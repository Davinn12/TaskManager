version: "3.9"

# ─────────────────────────────────────────────────────────────
#  TaskManager CI — Stack completo
#
#  Servicios:
#    frontend  → Next.js       http://localhost:3000
#    backend   → PHP + Slim    http://localhost:8080
#    db        → MySQL 8       localhost:3306
#    jenkins   → Jenkins LTS   http://localhost:8090
#
#  Uso:
#    docker-compose up           # levanta todo en primer plano
#    docker-compose up -d        # levanta todo en segundo plano
#    docker-compose down         # detiene y elimina los contenedores
#    docker-compose logs -f      # ver logs en tiempo real
#    docker-compose up --build   # reconstruir imágenes y levantar
# ─────────────────────────────────────────────────────────────

services:

  db:
    image: mysql:8.0
    container_name: taskmanager_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: taskmanager
      DB_USER: taskuser
      DB_PASSWORD: taskpass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskmanager_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - taskmanager_net

  # ── Jenkins CI ───────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: taskmanager_jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8090:8080"                        # UI de Jenkins (evita conflicto con backend en 8080)
      - "50000:50000"                      # agentes JNLP
    volumes:
      - jenkins_home:/var/jenkins_home     # persistencia de configuración y jobs
      - /var/run/docker.sock:/var/run/docker.sock  # acceso a Docker del host
    networks:
      - taskmanager_net

volumes:
  db_data:
    driver: local
  jenkins_home:
    driver: local

networks:
  taskmanager_net:
    driver: bridge

name: CI Pipeline — TaskManager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  #  Frontend: lint + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: task-manager/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Build de producción
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test -- --passWithNoTests

  # ─────────────────────────────────────────────
  #  Notificación de estado del pipeline
  # ─────────────────────────────────────────────
  notify:
    name: Notificar resultado
    needs: [frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Estado del pipeline
        run: |
          if [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ Pipeline completado exitosamente"
          else
            echo "❌ Pipeline falló — revisar logs"
            exit 1
          fi

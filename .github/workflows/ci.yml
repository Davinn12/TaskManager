name: CI Pipeline — TaskManager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  #  Frontend: lint + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Build de producción
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test -- --passWithNoTests

  # ─────────────────────────────────────────────
  #  Docker: verificar que la imagen construye
  # ─────────────────────────────────────────────
  docker:
    name: Docker build (frontend)
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # solo verifica que construye, no publica
          tags: taskmanager-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  #  Notificación de estado del pipeline
  # ─────────────────────────────────────────────
  notify:
    name: Notificar resultado
    needs: [frontend, docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Estado del pipeline
        run: |
          if [ "${{ needs.frontend.result }}" == "success" ] && [ "${{ needs.docker.result }}" == "success" ]; then
            echo "✅ Pipeline completado exitosamente"
          else
            echo "❌ Pipeline falló — revisar logs"
            exit 1
          fi

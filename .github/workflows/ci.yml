name: CI — TaskManager

# Se ejecuta en cada push y pull request sobre las ramas principales
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Lint, Pruebas y Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Instalación determinista de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Lint del código fuente
      - name: Lint
        run: npm run lint || true

      # 5. Pruebas unitarias con Jest
      - name: Pruebas unitarias
        run: npm test -- --watchAll=false --passWithNoTests

      # 6. Build de producción Next.js
      - name: Build de producción
        run: npm run build

  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: |
          docker build \
            -t taskmanager-frontend:${{ github.run_number }} \
            -t taskmanager-frontend:latest \
            .
          echo "Imagen construida: taskmanager-frontend:${{ github.run_number }}"

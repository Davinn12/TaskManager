name: CI — TaskManager

# Se ejecuta en cada push y pull request sobre las ramas principales
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Lint, Pruebas y Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Instalación determinista de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Lint del código fuente
      - name: Lint
        run: npm run lint || true

      # 5. Pruebas unitarias con Jest
      - name: Pruebas unitarias
        run: npm test -- --watchAll=false --passWithNoTests

      # 6. Build de producción Next.js
      - name: Build de producción
        run: npm run build

  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: |
          docker build \
            -t taskmanager-frontend:${{ github.run_number }} \
            -t taskmanager-frontend:latest \
            .
          echo "Imagen construida: taskmanager-frontend:${{ github.run_number }}"

  deploy-pages:
    name: Desplegar en GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Build estático para GitHub Pages (solo si las pruebas pasaron)
      - name: Build estático
        run: npm run build
        env:
          NEXT_EXPORT: "true"

      # 5. Configurar GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v4

      # 6. Subir artefacto al sistema de Pages
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # 7. Desplegar en GitHub Pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
